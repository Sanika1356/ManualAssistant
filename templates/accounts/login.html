<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Manual Assistant</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background: #dbeafe;
            color: #2563eb;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 15px;
        }

        .login-title {
            font-weight: 700;
            color: #1e293b;
        }

        .login-subtitle {
            color: #64748b;
            font-size: 14px;
        }

        .form-control {
            padding: 12px;
        }

        .btn-login {
            padding: 12px;
            font-weight: 600;
            background: #2563eb;
            border: none;
        }

        .btn-login:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="text-center mb-4">
            <div class="brand-icon">⚙</div>

            <h2 class="login-title">Manual Assistant</h2>

            <p class="login-subtitle">
                Your intelligent machine manual assistant
            </p>
        </div>

        <h5 class="mb-3">Welcome Back!</h5>

        <form id="loginForm">

            <div class="mb-3">
                <label class="form-label">Username</label>

                <input
                    type="text"
                    class="form-control"
                    id="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div id="errorMessage"
                 class="alert alert-danger d-none"
                 role="alert">
            </div>

            <button type="submit"
                    class="btn btn-primary btn-login w-100"
                    id="loginButton">
                Login
            </button>

        </form>

        <p class="text-center text-muted mt-4 mb-0"
           style="font-size: 12px;">
            Manual Assistant | Secure Role-Based Access
        </p>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const errorMessage = document.getElementById("errorMessage");
        const loginButton = document.getElementById("loginButton");

        // Read the CSRF token from the browser cookie
        function getCookie(name) {
            const cookies = document.cookie.split(";");

            for (let cookie of cookies) {
                cookie = cookie.trim();

                if (cookie.startsWith(name + "=")) {
                    return decodeURIComponent(
                        cookie.substring(name.length + 1)
                    );
                }
            }

            return null;
        }

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            errorMessage.classList.add("d-none");
            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                // First, obtain the CSRF cookie
                await fetch("/api/csrf/", {
                    credentials: "same-origin"
                });

                const csrfToken = getCookie("csrftoken");

                if (!csrfToken) {
                    throw new Error("Unable to obtain security token. Refresh and try again.");
                }

                // Send login details to Django API
                const response = await fetch("/api/login/", {
                    method: "POST",

                    credentials: "same-origin",

                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfToken
                    },

                    body: JSON.stringify({
                        username: document.getElementById("username").value,
                        password: document.getElementById("password").value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Login failed. Check your credentials."
                    );
                }

                // Login successful: go to the dashboard
                window.location.href = "/dashboard/";

            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.classList.remove("d-none");

            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>

</body>
</html>
