<style>
    .workbench { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: calc(100vh - 60px); }
    .library { background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .library-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
    .library-head h1 { font-size: 18px; font-weight: 700; margin: 0 0 10px; }
    .library-list { overflow-y: auto; flex: 1; padding-bottom: 12px; }
    .machine-item { border-bottom: 1px solid #e3e8ec; }
    .machine-pick {
        display: block; width: 100%; text-align: left; background: none; border: 0;
        border-left: 5px solid transparent; padding: 11px 16px 11px 13px;
    }
    .machine-pick:hover { background: #f3f6f8; }
    .machine-pick[aria-pressed="true"] { background: #e8f0f6; border-left-color: var(--enamel); }
    .machine-pick strong { display: block; font-family: "Archivo", Arial, sans-serif; font-size: 15px; }
    .machine-pick small { color: var(--steel); font-size: 14px; }
    .manual-list { list-style: none; margin: 0; padding: 0 16px 10px 18px; }
    .manual-list li { padding: 5px 0; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; }
    .manual-list span { color: var(--steel); }

    .bench { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .thread { flex: 1; overflow-y: auto; padding: 24px; }
    .thread-inner { max-width: 820px; margin: 0 auto; }
    .start { padding: 48px 0; max-width: 56ch; }
    .start h2 { font-size: 26px; font-weight: 700; }
    .start p { color: var(--steel); }

    .q-row { display: flex; justify-content: flex-end; margin: 22px 0 10px; }
    .q-bubble {
        background: var(--enamel); color: #fff; padding: 9px 14px; border-radius: 3px;
        max-width: 80%; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .answer { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; }
    .answer-none { border-color: #e5c98f; background: #fffaf0; }
    .answer-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-bottom: 8px; font-size: 14px; color: var(--steel); }
    .answer-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .cite { font-weight: 700; text-decoration: none; padding: 0 1px; }
    .cite:hover { text-decoration: underline; }

    .composer { border-top: 1px solid var(--line); background: #fff; padding: 14px 24px 16px; }
    .composer-inner { max-width: 820px; margin: 0 auto; }
    .composer-label { font-size: 14px; color: var(--steel); margin-bottom: 6px; }
    .composer-label strong { color: var(--ink); }
    .composer-row { display: flex; gap: 10px; align-items: flex-end; }
    .composer textarea { resize: none; }

    @media (max-width: 860px) {
        .workbench { grid-template-columns: 1fr; height: auto; }
        .library { border-right: 0; border-bottom: 1px solid var(--line); }
        .library-list { max-height: 260px; }
        .thread { min-height: 45vh; padding: 16px; }
        .composer { position: sticky; bottom: 0; padding: 12px 16px; }
    }
</style>

<main class="workbench">
    <aside class="library" aria-label="Machine and manual library">
        <div class="library-head">
            <h1>Machines and manuals</h1>
            <label class="visually-hidden" for="librarySearch">Search machines and manuals</label>
            <input class="form-control" id="librarySearch" type="search" placeholder="Search by name or ID">
        </div>
        <div class="library-list" id="libraryList"><p class="empty">Loading machines</p></div>
    </aside>

    <section class="bench" aria-label="Ask the manuals">
        <div class="thread" id="thread" aria-live="polite"><div class="thread-inner" id="threadInner"></div></div>
        <div class="composer">
            <form class="composer-inner" id="askForm">
                <div id="askNotice"></div>
                <div class="composer-label" id="askingAbout">Choose a machine to start.</div>
                <div class="composer-row">
                    <label class="visually-hidden" for="questionInput">Your question</label>
                    <textarea class="form-control" id="questionInput" rows="2" maxlength="1000" placeholder="What does alarm E17 mean?" disabled></textarea>
                    <button class="btn btn-main" id="askButton" type="submit" disabled>Ask</button>
                </div>
            </form>
        </div>
    </section>
</main>

<script>
    let machines = [];
    let manuals = [];
    let history = [];
    let selected = null;
    let asking = false;

    const threadBox = document.getElementById("thread");
    const threadInner = document.getElementById("threadInner");
    const questionInput = document.getElementById("questionInput");
    const askButton = document.getElementById("askButton");
    const askNotice = document.getElementById("askNotice");

    function manualsOf(machine) {
        return manuals.filter(m => m.machine_name === machine.name && m.machine_model === machine.model);
    }

    function drawLibrary() {
        const term = document.getElementById("librarySearch").value.trim().toLowerCase();
        const list = document.getElementById("libraryList");
        list.replaceChildren();

        const found = machines.filter(machine =>
            [machine.machine_code, machine.name, machine.model,
             ...manualsOf(machine).flatMap(m => [m.document_id, m.name])]
                .join(" ").toLowerCase().includes(term)
        );

        if (!found.length) {
            list.append(el("p", { class: "empty", text: machines.length ? "Nothing matches your search." : "No machines yet. Ask your Administrator to add one." }));
            return;
        }

        found.forEach(machine => {
            const isSelected = selected && selected.id === machine.id;
            const item = el("div", { class: "machine-item" },
                el("button", {
                    type: "button", class: "machine-pick", "aria-pressed": String(!!isSelected),
                    onclick: () => selectMachine(machine),
                },
                    el("strong", { text: `${machine.name} (${machine.model})` }),
                    el("small", { text: `${machine.machine_code || "No machine ID"}, ${manualsOf(machine).length} manual${manualsOf(machine).length === 1 ? "" : "s"}` })
                )
            );
            if (isSelected) {
                const ul = el("ul", { class: "manual-list" });
                const own = manualsOf(machine);
                if (!own.length) ul.append(el("li", {}, el("span", { text: "No manuals uploaded yet." })));
                own.forEach(manual => {
                    ul.append(el("li", {},
                        el("a", { href: `/api/manuals/${manual.id}/pdf/`, target: "_blank", rel: "noopener", text: manual.document_id || manual.name }),
                        el("span", { text: `Rev ${manual.revision}` })
                    ));
                });
                item.append(ul);
            }
            list.append(item);
        });
    }

    function answerCard(question) {
        const refused = question.status !== "answered";
        const card = el("div", { class: `answer${refused ? " answer-none" : ""}` },
            el("div", { class: "answer-meta" }, statusBadge(question.status), formatDateTime(question.created_at)),
            answerWithLinks(question.answer, question.sources)
        );
        (question.sources || []).forEach(source => card.append(sourcePlate(source)));
        return card;
    }

    function addQuestion(text) {
        threadInner.append(el("div", { class: "q-row" }, el("div", { class: "q-bubble", text })));
    }

    function scrollDown() {
        threadBox.scrollTop = threadBox.scrollHeight;
    }

    function drawThread() {
        threadInner.replaceChildren();
        if (!selected) {
            threadInner.append(el("div", { class: "start" },
                el("h2", { text: "Choose a machine, then ask" }),
                el("p", { text: "Answers come only from the selected machine's manuals, with the document, revision and page for each fact. If the manuals don't cover something, you'll be told." })
            ));
            return;
        }
        const own = history.filter(q => q.machine_id === selected.id);
        if (!own.length) {
            threadInner.append(el("div", { class: "start" },
                el("h2", { text: `Ask about the ${selected.model}` }),
                el("p", { text: "Type a maintenance question below. Your questions and answers are saved here." })
            ));
            return;
        }
        own.forEach(question => {
            addQuestion(question.text);
            threadInner.append(answerCard(question));
        });
        scrollDown();
    }

    function selectMachine(machine) {
        if (asking) return;
        selected = machine;
        askNotice.replaceChildren();
        const label = document.getElementById("askingAbout");
        label.replaceChildren("Asking about ", el("strong", { text: `${machine.name} (${machine.model})` }));
        questionInput.disabled = false;
        askButton.disabled = false;
        drawLibrary();
        drawThread();
        questionInput.focus();
    }

    async function ask(event) {
        event.preventDefault();
        const text = questionInput.value.trim();
        if (!selected || !text || asking) return;

        asking = true;
        askButton.disabled = true;
        askButton.textContent = "Searching";
        askNotice.replaceChildren();

        threadInner.querySelector(".start")?.remove();
        addQuestion(text);
        const waiting = el("div", { class: "answer answer-meta", text: `Searching the ${selected.model} manuals` });
        threadInner.append(waiting);
        scrollDown();

        try {
            const question = await api("/api/ask/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ machine: selected.id, question: text }),
            });
            history.push(question);
            waiting.replaceWith(answerCard(question));
            questionInput.value = "";
        } catch (error) {
            // Keep the typed question so it can be sent again.
            waiting.previousElementSibling?.remove();
            waiting.remove();
            if (!threadInner.children.length) drawThread();
            showNotice(askNotice, error.message, "bad");
        } finally {
            asking = false;
            askButton.disabled = false;
            askButton.textContent = "Ask";
            scrollDown();
            questionInput.focus();
        }
    }

    document.getElementById("askForm").addEventListener("submit", ask);
    document.getElementById("librarySearch").addEventListener("input", drawLibrary);
    questionInput.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            document.getElementById("askForm").requestSubmit();
        }
    });

    (async function start() {
        drawThread();
        try {
            const [machineData, manualData, historyData] = await Promise.all([
                api("/api/machines/"), api("/api/manuals/"), api("/api/history/"),
            ]);
            machines = machineData;
            manuals = manualData;
            history = historyData.slice().reverse();
            drawLibrary();
            if (machines.length === 1) selectMachine(machines[0]);
        } catch (error) {
            showNotice(askNotice, error.message, "bad");
            document.getElementById("libraryList").replaceChildren(el("p", { class: "empty", text: "The library could not be loaded." }));
        }
    })();
</script>
